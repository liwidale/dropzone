[package]
name = "dropzone"
version = "1.3.0"
description = "Local-first desktop app for macOS, Windows and Linux that sorts your Downloads and other folders with rules you can preview and undo."
authors = ["Liwidale"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "dropzone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1"
tauri-plugin-notification = "2"
tauri-plugin-drag = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = "1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
